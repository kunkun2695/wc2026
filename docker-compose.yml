version: '3.8'

services:
  app:
    build: .
    ports:
      - "5005:5005"
    environment:
      - DATABASE_URL=postgres://user:pass@db:5432/worldcup2026
      - CORS_ORIGIN=*
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=worldcup2026
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
